<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página em Grid</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="site">

        <header>
            <h1>Meu Site Simples</h1>
        </header>

        <nav>
            <a href="#">Início</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
        </nav>

        <main>
            <h2>Título da Página</h2>
            <p>Este é o conteúdo principal da página. Aqui você coloca os textos, artigos ou imagens.</p>
        </main>

        <aside>
            <h3>Barra Lateral</h3>
            <p>Conteúdo secundário, links adicionais ou avisos.</p>
        </aside>

        <footer>
            <p>Rodapé - Todos os direitos reservados</p>
        </footer>

    </div>

</body>

</html>
